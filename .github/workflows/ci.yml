name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # The design system is consumed from a sibling checkout until it is published
      # (scripts/link-design-system.ts), so CI lays out both repos side by side.
      - uses: actions/checkout@v4
        with: { path: upcytech }
      - uses: actions/checkout@v4
        with:
          repository: UpcyTech/design-system
          path: design-system
          token: ${{ secrets.DESIGN_SYSTEM_READ_TOKEN }}
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.9 }

      - name: Build design-system tokens
        working-directory: design-system
        run: bun install --frozen-lockfile && bun run tokens

      - name: Install
        working-directory: upcytech
        run: bun install --frozen-lockfile

      - name: Test
        working-directory: upcytech
        run: bun run test

      - name: Typecheck
        working-directory: upcytech
        run: bun run typecheck

      - name: Build
        working-directory: upcytech
        run: bun run build

      - name: Install Chromium for responsive regression tests
        working-directory: upcytech
        run: bunx playwright install --with-deps chromium

      - name: Start production server for responsive regression tests
        working-directory: upcytech
        run: |
          bun run start -p 3010 > "$RUNNER_TEMP/upcytech-next.log" 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:3010/tr > /dev/null && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3010/tr > /dev/null || {
            cat "$RUNNER_TEMP/upcytech-next.log"
            exit 1
          }

      - name: Responsive browser regression
        working-directory: upcytech
        run: PLAYWRIGHT_BASE_URL=http://127.0.0.1:3010 bun run test:e2e

      # Bun is the only package manager, as in the design system.
      - name: No foreign lockfiles
        working-directory: upcytech
        run: |
          for f in package-lock.json pnpm-lock.yaml yarn.lock pnpm-workspace.yaml; do
            if [ -e "$f" ]; then echo "::error::$f present - this repo is Bun-only"; exit 1; fi
          done
